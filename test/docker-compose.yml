name: nestjs-cls-test

services:
  postgres:
    image: postgres:15
    ports:
      - 5444:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 30

  # Transactions require a replica set. The healthcheck initiates a single-node
  # one on the first run and reports the set's status on every run after that.
  # Mongo listens on the same port inside the container as it is published on,
  # so the advertised member address resolves both inside and outside of it.
  mongo:
    image: mongo:8
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27044']
    ports:
      - 27044:27044
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --port 27044 --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27044\" }] }).ok }"',
        ]
      interval: 1s
      timeout: 5s
      retries: 30
